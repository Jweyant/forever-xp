# ForeverXP — Tauren 6-12, Mulgore. Ends at the Crossroads, where the Horde Barrens guides start.
# Order only; tools/guidegen.py fills coordinates, NPCs and checks from Forever Questie data.
# Mulgore's map frame changed in Forever; all positions come from Questie's converted coordinates
# (spot-checked: Bloodhoof, Camp Narache, Red Rocks, the Venture Co. mine and Thunder Bluff line up).
# Forever-only quests on the way are included: 96605 The Great Outdoors, 99108 Sparring Match,
# 96130 Chakuyak, 98430 The Longwalkers, 99411 Kyle's Gone Missing!, the Longwalker chain
# (99079, 99081, 99101, 99080, 99082) and 98424 Fizsprocket's Notes / 98435 Thunderhorn's Report.
# No source has their XP yet, so the estimate uses approximate values for them (~ in the report).
# Skipped on purpose: the Camping 101 profession quests (one per profession, no XP value for leveling),
# 98427 Ceasing Operations (Venture Co. Clearclutter is an elite), 744 Preparation for Ceremony
# (harpies in the far north-west), 770 The Demon Scarred Cloak (rare drop from Ghost Howl),
# 768/769 Gathering Leather / Kodo Hide Bag (skinning turn-ins in Thunder Bluff),
# 76156 Stalk With The Earthmother chain and 97485 Traditions of the Bluff (Thunder Bluff errands
# with shopping and long walks for little XP).
# Quest order checked against the Ding! Tauren guide (moust4ki/DingGuideWoWForever, GPL-3.0).
