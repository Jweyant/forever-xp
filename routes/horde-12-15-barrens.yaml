    only: Orc/Troll/Undead
    text: Go in through Orgrimmar's front gate.
  - accept: 97246
    only: Orc/Troll/Undead
    town: true
    text: Thatog is just inside the gate, in the Valley of Strength.
  - fp: Orgrimmar
    only: Orc/Troll/Undead
    town: true
    text: Doras is on the tower by the bank in the Valley of Strength.
  - turnin: 97246
    accept: 97249
    only: Orc/Troll/Undead
    town: true
  - accept: 809
    only: Orc/Troll
    town: true
    text: Neeru Fireblade is in the Cleft of Shadow (the ramp down from the Valley of Strength).
  - accept: 5726
    only: Orc/Troll/Undead
    town: true
    text: Thrall is in Grommash Hold.
  - accept: 97242
    only: Orc/Troll/Undead
    town: true
    text: Kor'geld is in Yelmak's Alchemy in the Drag.
  - complete: 97242
    only: Orc/Troll/Undead
    town: true
    text: Cattails and Speargrass grow along the water in the Valley of Honor.
  - turnin: 97242
    only: Orc/Troll/Undead
    town: true
  - accept: 97275
    only: Orc/Troll/Undead
    town: true
  - turnin: 97275
    only: Orc/Troll/Undead
    town: true
    text: Whuut is in the same shop.
  - turnin: 97249
    only: Orc/Troll/Undead
    town: true
    text: Migi is behind Grommash Hold.
  - accept: 97326
    only: Orc/Troll/Undead
    town: true
  - complete: 97326
    only: Orc/Troll/Undead
    town: true
    text: Smooth Boulders lie on the ground around the back of Grommash Hold.
  - turnin: 97326
    only: Orc/Troll/Undead
    town: true

  - complete: 5726
    only: Orc/Troll/Undead
    text: Leave by the front gate. Burning Blade Fanatics and Apprentices in Skull Rock, just east of the gate, drop the insignia.
  - turnin: 5726
    accept: 5727
    only: Orc/Troll/Undead
    town: true
  - complete: 5727
    only: Orc/Troll/Undead
    town: true
    text: Show the insignia to Neeru Fireblade in the Cleft of Shadow and talk to him.
  - turnin: 5727
    only: Orc/Troll/Undead
    town: true
    text: Back to Thrall. Skip the next part, Hidden Enemies, which is in Ragefire Chasm.

  # --- Far Watch Post and the Altar of Fire
  - hs: Razor Hill
    hs_to: [1411, 51.51, 41.64]
    only: Orc/Troll
    text: Hearth to Razor Hill, then run west over the bridge into the Barrens. Undead walk out of Orgrimmar and follow the road south-west.
  - turnin: 840
    accept: 842
    only: Orc/Troll
    text: Kargal Battlescar at Far Watch Post, just over the bridge.
  - turnin: 809
    accept: 924
    only: Orc/Troll
    text: Ak'Zeloth stands next to the Far Watch tower.
  - complete: 924
    only: Orc/Troll
    text: Take a Flawed Power Stone from the pile by Ak'Zeloth and run it west to the Altar of Fire on Dreadmist Peak before it expires. Don't stop to fight on the way.
  - turnin: 924
    only: Orc/Troll
    text: Back to Ak'Zeloth, then follow the road south-west to the Crossroads.

  # --- The Crossroads (Tauren and Skyborne start here)
  - fp: Crossroads
