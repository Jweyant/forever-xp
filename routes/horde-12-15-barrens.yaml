# ForeverXP — Horde 12-15, Orgrimmar and the northern Barrens (Far Watch Post, the Crossroads, Ratchet).
# Order only; tools/guidegen.py fills coordinates, NPCs and checks from Forever Questie data.
# Orcs and Trolls (and Undead off the zeppelin) start outside Orgrimmar's gate at about 11.4.
# Tauren and Skyborne arrive at the Crossroads at about 12: skip to the "Crossroads" section; the
# Orgrimmar and Far Watch steps are tagged so RestedXP hides the ones you can't do.
# Forever-only quests on the way are included: Orgrimmar's 97246 Meal Appeal, 97249 Favorite Food,
# 97242 Yelmak's Medley, 97275 Whuut's the Rush, 97326 Rocks to Rests, and Ratchet's 97253 Parts and
# Pieces. Questie has no XP for them yet; guidegen uses a same-level estimate (marked ~ in the report).
# Route choice: pure Barrens. Silverpine 12-15 is a zeppelin round trip for Orcs/Trolls/Tauren and its
# quests sit far apart (Pyrewood, Fenris, Ambermill); the Barrens is denser and is where 22-24 starts.
# Skipped on purpose: 96874 This Is Spinal Axe and 96875 Beasts of Thunder Ridge (need crafted
# Cured Light Hides / Rough Grinding Stones and a Thunder Ridge trip, ~10 min each),
# 5728 Hidden Enemies part 3 (Ragefire Chasm dungeon), 1061 The Spirits of Stonetalon (breadcrumb;
# 22-24 skips the Goblin Invaders follow-up), 853 Apothecary Zamah (Thunder Bluff trip),
# 899 Consumed by Hatred (60 tusks, ~40 min), 6541 Report to Kadrak / 6543 The Warsong Reports
# (Mor'shan and Ashenvale runs), the Camping 101 profession quests.
# Quest order sanity-checked against the Ding! guide (moust4ki/DingGuideWoWForever, GPL-3.0).
guide:
  name: 12-15 The Barrens
  display: ForeverXP 12-15 The Barrens
  next: 15-18 The Barrens
  group: ForeverXP Horde
  for: Horde
  sim_race: Troll
  class: Hunter
  version: 1

steps:
  # --- Orgrimmar (Orc/Troll/Undead; Tauren and Skyborne skip to the Crossroads)
