# ForeverXP — Undead 6-12, Tirisfal Glades. Ends at the Undercity zeppelin tower for Orgrimmar.
# Order only; tools/guidegen.py fills coordinates, NPCs and checks from Forever Questie data.
# Forever-only quests on the way are included: the Brill Executor quests (99134 Discipline,
# 99141 Patience), Eleanor Shackleton's camp (96607, 86784), 99144 Seeking Refuge, 97558 Hides for
# the Forsaken, 99142 Tomb Weed, 99156 Riptear, the Argent Dawn chain (96895 → 98545) and the
# Shadowvale quests (95314, 95328, 99152, 99153), plus the Undead Paladin chain (91282 → 95803)
# behind `only: Paladin`. No source has their XP yet, so the estimate uses
# approximate values for them (marked ~ in the report).
# Route choice: this goes Tirisfal → zeppelin → Barrens instead of Silverpine 10-14. Silverpine's
# early quests are mostly breadcrumbs and long runs to Pyrewood/Fenris; with Forever's ~30 new
# Tirisfal quests the zone alone carries you to 12+, and the Barrens has better density at 12-15.
# Skipped on purpose: 590 A Rogue's Deal (fight Calvin back at Deathknell), 405/357/366/409/411
# the Gunther/Bethor lich chain (several Undercity trips and the island), 372 Captain Melrache
# (far north-east, bodyguards), 408 The Family Crypt (level 13 crypt with Dargol), 445 Delivery to
# Silverpine (we don't go there), 1818+ / 1478+ / 1881+ / 1885+ the level 10 class quests
# (Undercity/Silverpine detours, left to the player), the Camping 101 profession quests (96658+),
# and the Paladin 94427 A Lesson in Divinity chain (linen, Undercity, Venomweb Vale round trips).
# Quest order sanity-checked against the Ding! guide (moust4ki/DingGuideWoWForever, GPL-3.0).
guide:
  name: 6-12 Tirisfal Glades
  display: ForeverXP 6-12 Tirisfal Glades
  next: 12-15 The Barrens
  group: ForeverXP Horde
  for: Undead
  class: Warrior
  version: 1

