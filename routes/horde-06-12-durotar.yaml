# ForeverXP — Troll/Orc 6-12, Durotar.
# Skipped on purpose: 5843 Welcome! (voucher item only some players have),
# 6069 The Hunter's Path (optional breadcrumb; Thotar gives the pet quest directly).
# 812/813 Need for a Cure is done at the end because its scorpids are outside Orgrimmar's gate.
guide:
  name: 6-12 Durotar
  display: ForeverXP 6-12 Durotar
  next: 12-15 The Barrens
  group: ForeverXP Horde
  for: Orc/Troll
  class: Hunter
  version: 1

