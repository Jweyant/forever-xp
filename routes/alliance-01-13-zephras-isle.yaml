# ForeverXP — Skyborne (Alliance) 1-13, Zephras Isle.
# Order only; tools/guidegen.py fills coordinates, NPCs and checks from Forever Questie data.
# Quest order sanity-checked against the Ding! guide (moust4ki/DingGuideWoWForever, GPL-3.0),
# Guides/Leveling/Skyborne/01.lua.
# Every quest on the isle is Forever-only and no source has their XP yet, so the estimate uses
# approximate values (~ in the report) and may run high: expect to finish around level 13-14.
# Skipped on purpose: the Camping 101 profession quests (97963-97973, 96646, 98285, 98286; they need a
# profession and are only a recipe), 93318 WANTED: Vulgara (elite), 93459 More Al'Aketh Ears
# (repeatable), 94490/94491 Ripped Missive (only if the item drops), 94484 Unnerving Silence (same
# step as 94493, which is on the way), the Hunter pet chain (94007, 94978, 94979, 94013, 94050: three
# trips back to Valanaar; do it at 10 with the trainer's directions) and the Druid bear chain
# (94006, 94638: a detour to the falls north-east of Valanaar).
