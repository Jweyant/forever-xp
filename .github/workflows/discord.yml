# Forever XP Discord bot.
#  - Pull requests: validate discord/server.json and run the bot's offline tests (no secrets).
#  - main (or run by hand): apply discord/server.json to the server. Adds and updates channels,
#    topics, forum tags, read-only settings and roles; deletes only roles listed in retired_roles.
#  - Run by hand with a date: also post that day's Blizzard changes to the feed channel.
# Needs the DISCORD_BOT_TOKEN secret and DISCORD_GUILD_ID variable (see docs/discord.md).
name: Discord

on:
  pull_request:
    paths: ["discord/**", "tools/discord_bot.py", "tools/test/test_discord_bot.py", ".github/workflows/discord.yml"]
  push:
    branches: [main]
    paths: ["discord/**", "tools/discord_bot.py", ".github/workflows/discord.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would change"
        type: boolean
        default: true
      post_date:
        description: "Also post Blizzard's changes from this day to #forever-announcements (YYYY-MM-DD, optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: discord-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Discord config and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 tools/discord_bot.py validate
      - run: python3 tools/test/test_discord_bot.py

  apply:
    name: Apply server layout
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply discord/server.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_GUILD_ID" ]; then echo "::notice::Discord bot not configured yet; see docs/discord.md."; exit 0; fi
          python3 tools/discord_bot.py setup $DRY
      # The date is passed through the environment, never pasted into the script, and checked by the bot.
      - name: Post one day's changes
        if: github.event_name == 'workflow_dispatch' && inputs.post_date != ''
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          POST_DATE: ${{ inputs.post_date }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_GUILD_ID" ]; then echo "::notice::Discord bot not configured yet; see docs/discord.md."; exit 0; fi
          files=(gamedata/blizzard-notes.json)
          if git fetch -q --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:gamedata/blizzard-notes.json > "$RUNNER_TEMP/data-notes.json" 2>/dev/null; then files+=("$RUNNER_TEMP/data-notes.json"); fi
          python3 tools/discord_bot.py post-date "$POST_DATE" "${files[@]}" $DRY
