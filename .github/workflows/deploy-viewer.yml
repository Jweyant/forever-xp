# Deploys the 3D gear viewer (viewer/) to Cloudflare whenever it changes on main.
#
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the upload server,
# plus one repository variable:
#   variable VIEWER_HOST   hostname for the viewer, e.g. viewer.yourdomain.com
# Cloudflare creates the DNS record and HTTPS certificate for VIEWER_HOST automatically.
# Changing the hostname also means updating frame-ancestors in viewer/src/index.js,
# SITE.viewer3d in site/src/config.ts and frame-src in tools/csp.mjs.

name: Deploy 3D viewer

on:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/deploy-viewer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check configuration
        id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          VIEWER_HOST: ${{ vars.VIEWER_HOST }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ -z "$VIEWER_HOST" ]; then
            echo "::notice::Cloudflare secrets or VIEWER_HOST not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Install, audit and test
        if: steps.cfg.outputs.ready == 'true'
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run vendor

      - name: Add custom domain route
        if: steps.cfg.outputs.ready == 'true'
        env:
          VIEWER_HOST: ${{ vars.VIEWER_HOST }}
        run: printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$VIEWER_HOST" >> wrangler.toml

      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.149.0"  # exact; v4 of the action defaults to "latest"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: viewer
          command: deploy

      - name: Health check
        if: steps.cfg.outputs.ready == 'true'
        env:
          VIEWER_HOST: ${{ vars.VIEWER_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "https://${VIEWER_HOST}/health"; then echo; exit 0; fi
            sleep 20
          done
          echo "::warning::Deployed, but https://${VIEWER_HOST}/health is not answering yet (DNS/certificate can take a few minutes)."
