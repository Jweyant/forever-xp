# Collects Blizzard's official WoW Forever change notes (development notes, class updates, known
# issues, and new staff notes as they're posted) into gamedata/blizzard-notes.json for the
# site's Changes page, and commits the result (to the `data` branch when run on main).
name: Refresh Blizzard notes

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["tools/blizzard_notes.py", "tools/push_data.sh", "tools/discord_bot.py", ".github/workflows/blizzard-notes.yml"]

permissions:
  contents: write
  actions: write   # to start the site deploy after a data commit on main

concurrency:
  group: blizzard-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Remember which changes we already had (main's copy plus the data branch's), so only
      # brand-new ones get posted to Discord.
      - name: Remember the previous notes
        run: |
          mkdir -p "$RUNNER_TEMP/prev" "$RUNNER_TEMP/bot/tools" "$RUNNER_TEMP/bot/discord"
          cp gamedata/blizzard-notes.json "$RUNNER_TEMP/prev/main.json" 2>/dev/null || echo '{"rows":[]}' > "$RUNNER_TEMP/prev/main.json"
          if git fetch -q origin data 2>/dev/null; then git show FETCH_HEAD:gamedata/blizzard-notes.json > "$RUNNER_TEMP/prev/data.json" 2>/dev/null || true; fi
          python3 - "$RUNNER_TEMP/prev" <<'PY'
          import json, sys, pathlib
          d = pathlib.Path(sys.argv[1]); rows = {}
          for f in ("main.json", "data.json"):
              p = d / f
              if p.exists() and p.stat().st_size:
                  for r in json.loads(p.read_text()).get("rows", []):
                      rows[r["id"]] = r
          (d / "old.json").write_text(json.dumps({"rows": list(rows.values())}))
          print(f"{len(rows)} changes already known")
          PY
          cp tools/discord_bot.py "$RUNNER_TEMP/bot/tools/" && cp discord/server.json "$RUNNER_TEMP/bot/discord/"

      - name: Collect notes
        run: |
          python3 tools/blizzard_notes.py --out gamedata/blizzard-notes.json
          cp gamedata/blizzard-notes.json "$RUNNER_TEMP/new-notes.json"
      - name: Commit if changed
        id: commit
        run: bash tools/push_data.sh "Refresh Blizzard's WoW Forever notes" gamedata/blizzard-notes.json

      - name: Post new changes to Discord
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_GUILD_ID" ]; then echo "Discord bot not configured; skipping."; exit 0; fi
          python3 "$RUNNER_TEMP/bot/tools/discord_bot.py" post-notes "$RUNNER_TEMP/prev/old.json" "$RUNNER_TEMP/new-notes.json"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy here.
      - name: Deploy the site with the new data
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
