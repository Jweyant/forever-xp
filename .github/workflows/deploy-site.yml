# Builds the website (site/) and deploys it to Cloudflare Pages on every push to main
# that touches the site or its data. Pull requests get a preview deploy.
#
# One-time setup:
#   1. Reuse the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets from the upload server.
#      The token also needs Account > Cloudflare Pages > Edit.
#   2. After the first deploy, in Cloudflare: Workers & Pages > forever-xp > Custom domains >
#      add forever-xp.com (and www.forever-xp.com). The DNS records are created for you.

name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "routes/**", "reports/**", "gamedata/**", "tools/site_data.py", "tools/csp.mjs", "tools/indexnow.py", "tools/zone_sizes.json", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["site/**", "routes/**", "reports/**", "gamedata/**", "tools/site_data.py", "tools/csp.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Scheduled data refreshes land on the `data` branch (main only changes through reviewed
      # pull requests). Use whichever copy of each data file is newer.
      - name: Use the newest generated data
        if: github.event_name != 'pull_request'
        run: |
          git fetch -q origin data || { echo "No data branch yet."; exit 0; }
          for f in gamedata/items.json gamedata/items-report.md gamedata/quests.json gamedata/blizzard-notes.json gamedata/talents.json; do
            d=$(git log -1 --format=%ct FETCH_HEAD -- "$f" 2>/dev/null); m=$(git log -1 --format=%ct HEAD -- "$f" 2>/dev/null)
            if [ "${d:-0}" -gt "${m:-0}" ]; then git show "FETCH_HEAD:$f" > "$f"; echo "Using $f from the data branch"; fi
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build data and site
        working-directory: site
        run: |
          npm ci
          npm run data
          npm run build

      # IndexNow (Bing and other engines): submit only the pages whose content changed since the
      # last deploy. The last deploy's page fingerprints come from the Actions cache.
      - name: Restore the last deploy's page fingerprints
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow/manifest.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: List changed pages
        id: indexnow
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: python3 tools/indexnow.py prepare --dist site/dist --previous .indexnow/manifest.json --manifest "$RUNNER_TEMP/indexnow-manifest.json" --out "$RUNNER_TEMP/indexnow.txt"

      - name: Check configuration
        id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Cloudflare secrets not set; built the site but skipped deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.149.0"  # exact; v4 of the action defaults to "latest"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from site/ so Pages picks up site/functions (the accounts API at /api/*).
          workingDirectory: site
          preCommands: npx wrangler pages project create forever-xp --production-branch main || true
          command: pages deploy dist --project-name forever-xp --branch ${{ github.head_ref || github.ref_name }}

      - name: Tell search engines about changed pages
        id: indexnow_submit
        if: steps.cfg.outputs.ready == 'true' && steps.indexnow.outcome == 'success'
        continue-on-error: true
        run: python3 tools/indexnow.py submit --list "$RUNNER_TEMP/indexnow.txt"

      - name: Keep page fingerprints for the next deploy
        if: steps.indexnow_submit.outcome == 'success'
        run: mkdir -p .indexnow && cp "$RUNNER_TEMP/indexnow-manifest.json" .indexnow/manifest.json

      - name: Save page fingerprints
        if: steps.indexnow_submit.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow/manifest.json
          key: indexnow-${{ github.run_id }}-${{ github.run_attempt }}
