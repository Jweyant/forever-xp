# Builds the website (site/) and deploys it to Cloudflare Pages on every push to main
# that touches the site or its data. Pull requests get a preview deploy.
#
# One-time setup:
#   1. Reuse the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets from the upload server.
#      The token also needs Account > Cloudflare Pages > Edit.
#   2. After the first deploy, in Cloudflare: Workers & Pages > forever-xp > Custom domains >
#      add forever-xp.com (and www.forever-xp.com). The DNS records are created for you.

name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "routes/**", "reports/**", "gamedata/**", "tools/site_data.py", "tools/csp.mjs", "tools/zone_sizes.json", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["site/**", "routes/**", "reports/**", "gamedata/**", "tools/site_data.py", "tools/csp.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Scheduled data refreshes land on the `data` branch (main only changes through reviewed
      # pull requests). Use whichever copy of each data file is newer.
      - name: Use the newest generated data
        if: github.event_name != 'pull_request'
        run: |
          git fetch -q origin data || { echo "No data branch yet."; exit 0; }
          for f in gamedata/items.json gamedata/items-report.md gamedata/quests.json gamedata/blizzard-notes.json; do
            d=$(git log -1 --format=%ct FETCH_HEAD -- "$f" 2>/dev/null); m=$(git log -1 --format=%ct HEAD -- "$f" 2>/dev/null)
            if [ "${d:-0}" -gt "${m:-0}" ]; then git show "FETCH_HEAD:$f" > "$f"; echo "Using $f from the data branch"; fi
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build data and site
        working-directory: site
        run: |
          npm ci
          npm run data
          npm run build

      - name: Check configuration
        id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Cloudflare secrets not set; built the site but skipped deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create forever-xp --production-branch main || true
          command: pages deploy site/dist --project-name forever-xp --branch ${{ github.head_ref || github.ref_name }}
