# Turns uploaded ForeverScout logs into the aggregate player data the site shows:
#   gamedata/players/quest_timing.csv     measured minutes and XP per minute per quest
#   gamedata/players/loot.csv             which item dropped from which source, by zone
#   gamedata/players/objective_areas.json where players progressed each quest objective
#   gamedata/players/scouts.json          the contributor leaderboard (anonymous handles and counts)
#   gamedata/players/encounters.csv       boss kills, wipes and kill times
#   gamedata/players/talent_builds.json   most-used talent builds per class
#
# Raw logs only exist inside this run: they are downloaded, parsed as data (never executed),
# aggregated, and discarded. Nothing per player is committed or uploaded as an artifact.
#
# Runs every hour and on demand (Actions > Refresh player data > Run workflow).

name: Refresh player data

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the site deploy after a data commit on main

concurrency:
  group: player-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download uploaded logs
        id: pull
        env:
          FSCOUT_ADMIN_TOKEN: ${{ secrets.FSCOUT_ADMIN_TOKEN }}
          UPLOAD_HOST: ${{ vars.UPLOAD_HOST }}
        run: |
          if [ -z "$FSCOUT_ADMIN_TOKEN" ] || [ -z "$UPLOAD_HOST" ]; then echo "Upload server not configured"; exit 0; fi
          python3 tools/pull_logs.py --server "https://$UPLOAD_HOST" --dest logs/
          if ls logs/*.lua >/dev/null 2>&1; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "No logs yet"; fi

      - name: Export Questie's Forever database
        if: steps.pull.outputs.have == 'true'
        run: bash tools/refresh_questie_data.sh

      # Who the leaderboard may name: players who linked an install to their account. If the site
      # can't be reached the board is left as last published (tools/ingest_logs.py write_scouts).
      - name: Fetch linked scout names
        if: steps.pull.outputs.have == 'true'
        run: |
          mkdir -p out
          curl -fsS --max-time 30 -A "forever-xp-player-data" https://forever-xp.com/api/scouts/names -o out/scout_names.json \
            || echo "Linked names unavailable; the leaderboard stays as it was"

      # Talent builds are digits in the game's tree order, so they're only counted on the trees they
      # were made for: the newest talent data (the refresh lands on the `data` branch), and the last
      # published builds, which record when each class's trees last changed.
      - name: Get the newest talent trees and the last published builds
        if: steps.pull.outputs.have == 'true'
        run: |
          mkdir -p out
          cp gamedata/talents.json out/talents.json
          if git fetch -q --depth=1 origin data; then
            git show FETCH_HEAD:gamedata/talents.json > out/talents-data.json 2>/dev/null || true
            git show FETCH_HEAD:gamedata/players/talent_builds.json > out/previous-builds.json 2>/dev/null || true
            if [ -s out/talents-data.json ]; then
              newest=$(python3 -I -c 'import sys; sys.path.insert(0, "tools"); import check_talent_order as c; print(c.newest(sys.argv[1:]))' out/talents.json out/talents-data.json)
              [ "$newest" = out/talents.json ] || cp "$newest" out/talents.json
            fi
          fi
          [ -s out/previous-builds.json ] || cp gamedata/players/talent_builds.json out/previous-builds.json 2>/dev/null || echo '{}' > out/previous-builds.json

      - name: Aggregate logs
        if: steps.pull.outputs.have == 'true'
        run: |
          python3 tools/ingest_logs.py --questie data/forever_questdb.sqlite \
            --maps data/questiedb/uiMapIdToAreaId.json --out out/ --names out/scout_names.json \
            --talents out/talents.json --previous-builds out/previous-builds.json logs/*.lua
          mkdir -p gamedata/players
          cp out/quest_timing.csv out/loot.csv out/objective_areas.json out/encounters.csv out/talent_builds.json gamedata/players/
          if [ -f out/scouts.json ]; then cp out/scouts.json gamedata/players/; fi
          rm -rf logs out

      - name: Commit if changed
        id: commit
        if: steps.pull.outputs.have == 'true'
        run: bash tools/push_data.sh "Refresh player data from ForeverScout logs" gamedata/players/quest_timing.csv gamedata/players/loot.csv gamedata/players/objective_areas.json gamedata/players/scouts.json gamedata/players/encounters.csv gamedata/players/talent_builds.json

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy here.
      # The gear rebuild folds the new loot sightings into items.json (as confirmed drop
      # sources) and starts its own deploy when that changes.
      - name: Deploy the site with the new data
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-site.yml --ref main
          gh workflow run gear-data.yml --ref main
