# Security checks on every pull request and on main: the hostile-input browser test against the
# built site, dependency audits, and a check that the security headers are in place. CodeQL runs
# separately (codeql.yml). The "Protect main" ruleset requires these to pass before merging.
name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Dependency audit
        working-directory: site
        run: npm audit --audit-level=high
      - name: Build
        working-directory: site
        run: |
          npm run data
          npm run build
      - name: Hostile-input test
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npm run test:security

  uploader:
    name: Uploader security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
      - name: Vet and vulnerability check
        working-directory: uploader
        run: |
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  server:
    name: Upload server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Tests (size limits, rate limits, input validation)
        working-directory: server
        run: npm test
