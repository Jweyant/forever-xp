# Security checks on every pull request and on main: the hostile-input browser test against the
# built site, dependency audits, and a check that the security headers are in place. CodeQL runs
# separately (codeql.yml). The "Protect main" ruleset requires these to pass before merging.
name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Dependency audit
        working-directory: site
        run: npm audit --audit-level=high
      - name: Build
        working-directory: site
        run: |
          npm run data
          npm run build
      - name: Hostile-input test
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npm run test:security
      - name: Accounts API tests
        working-directory: site
        run: npm run test:api
      - name: Data tool tests
        run: |
          python3 tools/test/test_wago.py
          python3 tools/test/test_blizzard_notes.py
          python3 tools/test/test_build_talents.py
          python3 tools/test/test_build_items.py
          python3 -I tools/test/test_simconfigs.py
          python3 tools/test/test_indexnow.py
          python3 tools/test/test_questxp.py
          python3 tools/test/test_objective_areas.py

  uploader:
    name: Uploader security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Vet and vulnerability check
        working-directory: uploader
        run: |
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  server:
    name: Upload server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tests (size limits, rate limits, input validation)
        working-directory: server
        run: npm test

  viewer:
    name: 3D viewer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tests (proxy allow-list, gear parameter validation)
        working-directory: viewer
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
