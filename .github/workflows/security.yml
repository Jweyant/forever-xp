# Security checks on every pull request and on main: the hostile-input browser test against the
# built site, dependency audits, and a check that the security headers are in place. CodeQL runs
# separately (codeql.yml). The "Protect main" ruleset requires these to pass before merging.
name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Dependency audit
        working-directory: site
        run: npm audit --audit-level=high
      - name: Build
        working-directory: site
        run: |
          npm run data
          npm run build
      - name: Hostile-input test
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npm run test:security
      - name: Suggested plans test
        working-directory: site
        run: npm run test:plans
      - name: Data tool tests
        run: |
          python3 tools/test/test_wago.py
          python3 tools/test/test_blizzard_notes.py
          python3 tools/test/test_build_talents.py
          python3 tools/test/test_build_items.py
          python3 tools/test/test_gear_gate.py
          python3 -I tools/test/test_simconfigs.py
          python3 -I tools/test/test_talent_order.py
          python3 tools/test/test_indexnow.py
          python3 tools/test/test_questxp.py
          python3 tools/test/test_quest_counts.py
          python3 tools/test/test_quest_chains.py
          python3 tools/test/test_raids.py
          python3 -I tools/test/test_talent_builds.py
  viewer:
    name: 3D viewer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tests (proxy allow-list, gear parameter validation)
        working-directory: viewer
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
