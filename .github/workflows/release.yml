# Push a tag like v0.1.0 to build ForeverScout, publish a GitHub Release,
# and (once configured) upload the same zip to CurseForge.
#
# CurseForge setup (one time, in the repo's Settings > Secrets and variables > Actions):
#   secret   CF_API_TOKEN       token from https://legacy.curseforge.com/account/api-tokens
#   variable CF_PROJECT_ID      numeric project ID from the CurseForge project page
#   variable CF_GAME_VERSIONS   comma-separated CurseForge game version names, e.g. "1.60.1"
#                               (must match names in CurseForge's version list exactly)
# Without these, the workflow still publishes the GitHub Release and skips CurseForge.
#
# Uploader app: the released binaries send logs to https://<UPLOAD_HOST> (the same variable the
# server deploy uses). Set UPLOAD_URL instead to override with a full address.

name: Release ForeverScout

on:
  push:
    tags: ["v*"]
  # Release tags are protected (only the maintainer can create v* tags), so push the tag yourself:
  #   git tag v0.3.0 && git push origin v0.3.0
  # Running this by hand only works for a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ADDON: ForeverScout
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package
        id: pkg
        run: |
          version="${TAG#v}"
          sed -i "s/^## Version: .*/## Version: ${version}/" "addon/${ADDON}/${ADDON}.toc"
          sed -i "s/^ns.VERSION = .*/ns.VERSION = \"${version}\"/" "addon/${ADDON}/Core.lua"
          zip="${ADDON}-${version}.zip"
          (cd addon && zip -qr "../${zip}" "${ADDON}" -x "${ADDON}/README.md")
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Build uploader
        env:
          UPLOAD_URL: ${{ vars.UPLOAD_URL }}
          UPLOAD_HOST: ${{ vars.UPLOAD_HOST }}
        run: |
          if [ -z "$UPLOAD_URL" ] && [ -n "$UPLOAD_HOST" ]; then UPLOAD_URL="https://${UPLOAD_HOST}"; fi
          if [ -z "$UPLOAD_URL" ]; then echo "::warning::UPLOAD_HOST not set; uploader builds will not send data"; fi
          flags="-s -w -X main.version=${{ steps.pkg.outputs.version }} -X main.uploadURL=${UPLOAD_URL}"
          cd uploader
          go vet ./...
          GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui ${flags}" -o ../ForeverScoutUploader.exe .
          GOOS=darwin GOARCH=arm64 go build -ldflags "${flags}" -o ../ForeverScoutUploader-mac-apple-silicon .
          GOOS=darwin GOARCH=amd64 go build -ldflags "${flags}" -o ../ForeverScoutUploader-mac-intel .

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$TAG" in *alpha*|*beta*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" "${{ steps.pkg.outputs.zip }}" --target "${GITHUB_SHA}" $prerelease \
            ForeverScoutUploader.exe ForeverScoutUploader-mac-apple-silicon ForeverScoutUploader-mac-intel \
            --title "${ADDON} ${{ steps.pkg.outputs.version }}" --generate-notes

      - name: Upload to CurseForge
        if: ${{ vars.CF_PROJECT_ID != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "CF_API_TOKEN not set; skipping"; exit 0; fi
          versions=$(curl -sf -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions)
          ids=$(python3 - "$versions" "$CF_GAME_VERSIONS" <<'PY'
          import json, sys
          available = json.loads(sys.argv[1])
          wanted = [w.strip() for w in sys.argv[2].split(",") if w.strip()]
          ids = [v["id"] for v in available if v["name"] in wanted]
          missing = set(wanted) - {v["name"] for v in available if v["id"] in ids}
          if missing or not ids:
              sys.exit(f"Unknown CurseForge game versions: {sorted(missing) or wanted}")
          print(json.dumps(ids))
          PY
          )
          tag="${TAG}"
          case "$tag" in *alpha*) type=alpha ;; *beta*) type=beta ;; *) type=release ;; esac
          meta=$(python3 -c 'import json,sys; print(json.dumps({"displayName": sys.argv[1], "gameVersions": json.loads(sys.argv[2]), "releaseType": sys.argv[3], "changelog": "See https://github.com/'"$GITHUB_REPOSITORY"'/releases/tag/'"$tag"'", "changelogType": "markdown"}))' \
            "ForeverScout ${{ steps.pkg.outputs.version }}" "$ids" "$type")
          curl -sf -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$meta" -F "file=@${{ steps.pkg.outputs.zip }}" \
            "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"
