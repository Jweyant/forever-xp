# Rebuilds gamedata/items.json (the BIS planner's gear database) from:
#   - the WoW Forever game client tables, via wago.tools
#   - cmangos classic-db (GPL-3.0) for boss drops, vendors, quest rewards and crafting
#   - AtlasLoot Classic (GPL-2.0) for instance, boss, PvP and faction reward lists
#   - Questie's Forever database (GPLv3) for Forever quest rewards, vendors, chests and drops
# It also rebuilds gamedata/quests.json (every Forever quest) from Questie, and commits the result
# (to the `data` branch when run on main; see tools/push_data.sh).
#
# Runs every Monday, on demand (Actions > Refresh gear data > Run workflow), and on pushes to
# branches that change the builder.

name: Refresh gear data

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["tools/build_items.py", "tools/build_quests.py", "tools/refresh_questie_data.sh", "tools/mysqldump.py", "tools/push_data.sh", ".github/workflows/gear-data.yml"]

permissions:
  contents: write
  actions: write   # to start the site deploy after a data commit on main

concurrency:
  group: gear-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Get open-source data
        run: |
          git clone -q --depth 1 https://github.com/cmangos/classic-db ext/classic-db
          git clone -q --depth 1 https://github.com/Hoizame/AtlasLootClassic ext/AtlasLootClassic
          zcat ext/classic-db/Full_DB/*.sql.gz > ext/cmangos.sql
          echo "cmangos $(git -C ext/classic-db rev-parse --short HEAD), AtlasLoot $(git -C ext/AtlasLootClassic rev-parse --short HEAD)" > ext/versions.txt

      - name: Export Questie's Forever database
        run: |
          bash tools/refresh_questie_data.sh | tee ext/questie.txt
          echo "Questie $(git -C .cache/QuestieDB rev-parse --short HEAD)" >> ext/versions.txt

      - name: Build gear database
        run: |
          python3 tools/build_items.py --download --cache .cache/wago \
            --cmangos ext/cmangos.sql --atlasloot ext/AtlasLootClassic --questie data/questiedb \
            --out gamedata/items.json --report gamedata/items-report.md
          printf '\nSources: %s\n' "$(paste -sd ';' ext/versions.txt | sed 's/;/, /g')" >> gamedata/items-report.md

      - name: Build quest database
        run: python3 tools/build_quests.py --cache .cache/wago --cmangos ext/cmangos.sql --out gamedata/quests.json

      - name: Commit if changed
        id: commit
        run: bash tools/push_data.sh "Refresh gear and quest data from Forever client, Questie, cmangos and AtlasLoot" gamedata/items.json gamedata/items-report.md gamedata/quests.json

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy here.
      - name: Deploy the site with the new data
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
