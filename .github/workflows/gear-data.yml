# Rebuilds gamedata/items.json (the BIS planner's gear database) from:
#   - the WoW Forever game client tables, via wago.tools
#   - cmangos classic-db (GPL-3.0) for boss drops, vendors, quest rewards and crafting
#   - AtlasLoot Classic (GPL-2.0) for instance, boss, PvP and faction reward lists
#   - Questie's Forever database (GPLv3) for Forever quest rewards, vendors, chests and drops
#   - wowlayerup-forever/opendata (data CC BY 4.0) for quest XP and givers Questie doesn't have yet
# It also rebuilds gamedata/quests.json (every Forever quest) from Questie, and commits the result
# (to the `data` branch when run on main; see tools/push_data.sh).
#
# Runs daily (Questie and the Forever client change often around launch), on demand (Actions > Refresh gear data > Run workflow), and on pushes to
# branches that change the builder.

name: Refresh gear data

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches-ignore: [main, data, "dependabot/**"]  # Dependabot branches never get data commits
    paths: ["tools/build_items.py", "tools/build_quests.py", "tools/questxp.py", "tools/wago.py", "tools/refresh_questie_data.sh", "tools/mysqldump.py", "tools/push_data.sh", ".github/workflows/gear-data.yml"]

permissions:
  contents: write
  actions: write   # to start the site deploy after a data commit on main

concurrency:
  group: gear-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Player loot sightings (gamedata/players/loot.csv) are committed to the `data` branch by
      # the player-data workflow; the gear build folds them in as confirmed drop sources.
      - name: Use the newest player loot data
        run: |
          git fetch -q --depth 1 origin data || { echo "No data branch yet."; exit 0; }
          f=gamedata/players/loot.csv
          d=$(git log -1 --format=%ct FETCH_HEAD -- "$f" 2>/dev/null); m=$(git log -1 --format=%ct HEAD -- "$f" 2>/dev/null)
          if [ "${d:-0}" -gt "${m:-0}" ]; then mkdir -p gamedata/players; git show "FETCH_HEAD:$f" > "$f"; echo "Using $f from the data branch"; fi

      - name: Get open-source data
        run: |
          git clone -q --depth 1 https://github.com/cmangos/classic-db ext/classic-db
          git clone -q --depth 1 https://github.com/Hoizame/AtlasLootClassic ext/AtlasLootClassic
          git clone -q --depth 1 https://github.com/wowlayerup-forever/opendata ext/opendata
          zcat ext/classic-db/Full_DB/*.sql.gz > ext/cmangos.sql
          echo "cmangos $(git -C ext/classic-db rev-parse --short HEAD), AtlasLoot $(git -C ext/AtlasLootClassic rev-parse --short HEAD), opendata $(git -C ext/opendata rev-parse --short HEAD)" > ext/versions.txt

      - name: Export Questie's Forever database
        run: |
          bash tools/refresh_questie_data.sh | tee ext/questie.txt
          echo "Questie $(git -C .cache/QuestieDB rev-parse --short HEAD)" >> ext/versions.txt

      - name: Build gear database
        run: |
          python3 tools/build_items.py --download --cache .cache/wago \
            --cmangos ext/cmangos.sql --atlasloot ext/AtlasLootClassic --questie data/questiedb \
            --out gamedata/items.json --report gamedata/items-report.md
          printf '\nSources: %s\n' "$(paste -sd ';' ext/versions.txt | sed 's/;/, /g')" >> gamedata/items-report.md

      - name: Build quest database
        run: python3 tools/build_quests.py --cache .cache/wago --cmangos ext/cmangos.sql --opendata ext/opendata --out gamedata/quests.json

      - name: Commit if changed
        id: commit
        run: bash tools/push_data.sh "Refresh gear and quest data from Forever client, Questie, cmangos and AtlasLoot" gamedata/items.json gamedata/items-report.md gamedata/other-items.json gamedata/quests.json

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy here.
      - name: Deploy the site with the new data
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
