# Rebuilds gamedata/simweights.json, the BIS planner's stat weights, by running OUR OWN simulations
# (tools/simrunner, configured by gamedata/simconfigs/) on the wowsims/forever combat engine
# (https://github.com/wowsims/forever, MIT). Every published number comes from these runs; nothing
# published by wowsims ships.
#
# The engine is pinned to one commit (WOWSIMS_COMMIT below, and the pseudo-version in
# tools/simrunner/go.mod — the offline test checks they agree), so the weights only change when a
# reviewed pull request moves the pin or edits a setup, or the talent trees change (setups keep their
# builds by name; tools/sim_talents.py). Runs on demand, after a talent refresh that changed the trees, and on pushes to work
# branches that change the runner, the setups or this file. On main the data goes to the `data`
# branch (tools/push_data.sh) and the site redeploys; on a work branch it's committed to that
# branch so the pull request shows the real output. Pull requests only run the offline tests.

name: Sim weights

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, data, "dependabot/**"]  # Dependabot branches never get data commits
    paths: ["tools/simrunner/**", "gamedata/simconfigs/**", "tools/push_data.sh", "tools/check_talent_order.py", "tools/build_talent_builds.py", "tools/sim_talents.py", ".github/workflows/sim-weights.yml"]
  pull_request:
    paths: ["tools/simrunner/**", "gamedata/simconfigs/**", "tools/test/test_simconfigs.py", "tools/check_talent_order.py",
      "tools/sim_talents.py", "tools/test/test_sim_talents.py",
      "tools/test/test_talent_order.py", ".github/workflows/sim-weights.yml"]

permissions:
  contents: read

env:
  WOWSIMS_COMMIT: 60c78e95916f44786f31b66452b6d31a2d4fa4ea  # wowsims/forever, 2026-11-04 (launch patch 1.60.1.70755)

concurrency:
  group: sim-weights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Sim setup tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -I tools/test/test_simconfigs.py
      - run: python3 -I tools/test/test_sim_talents.py

  build:
    name: Run the sims
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit gamedata/simweights.json (to the data branch when on main)
      actions: write   # start the site deploy after a data commit on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The engine, at exactly the pinned commit, in its own directory. The runner stages each
      # setup inside it so SIML `use` lines resolve against the engine's files at that commit.
      - name: Check out the engine at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wowsims/forever
          ref: ${{ env.WOWSIMS_COMMIT }}
          path: ext/wowsims
          persist-credentials: false

      # The talent refresh lands on the `data` branch; use the newer of the two copies for the whole run.
      # Our setups keep their builds by talent name (index.json), so after a tree change the .siml
      # talents lines are rewritten for the new tree here. A build that can no longer be made stops
      # the run, so no weights are published for it.
      - name: Use the newest talent data and rewrite our builds for it
        run: |
          if git fetch -q --depth=1 origin data && git show FETCH_HEAD:gamedata/talents.json > "$RUNNER_TEMP/talents-data.json"; then
            cp "$(python3 -I -c 'import sys; sys.path.insert(0, "tools"); import check_talent_order as c; print(c.newest(sys.argv[1:]))' gamedata/talents.json "$RUNNER_TEMP/talents-data.json")" "$RUNNER_TEMP/talents-newest.json"
            cp "$RUNNER_TEMP/talents-newest.json" gamedata/talents.json
          fi
          python3 -I tools/sim_talents.py gamedata/simconfigs gamedata/talents.json --write

      # A build string means the same talents to the engine as to our data, or the run sims the wrong build.
      - name: Check talent order against the engine
        run: python3 -I tools/check_talent_order.py ext/wowsims gamedata/simconfigs gamedata/talents.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: tools/simrunner/go.mod

      # The engine's generated protobuf Go files aren't committed there; generate them with a
      # protoc release pinned by version and checksum, and the protoc-gen-go the engine uses.
      - name: Generate the engine's proto code
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip"
          echo "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          PATH="$RUNNER_TEMP/protoc/bin:$(go env GOPATH)/bin:$PATH" make -C ext/wowsims sim/core/proto/api.pb.go

      # go mod tidy resolves the engine against the pinned checkout (the replace in go.mod), so the
      # build never drifts from the pin silently.
      - name: Run our stat-weight sims
        working-directory: tools/simrunner
        run: |
          go mod tidy
          go run -tags=with_db . -checkout "$GITHUB_WORKSPACE/ext/wowsims" \
            -configs "$GITHUB_WORKSPACE/gamedata/simconfigs" \
            -out "$GITHUB_WORKSPACE/gamedata/simweights.json" -iterations 5000

      - name: Commit if changed
        id: commit
        run: bash tools/push_data.sh "Refresh stat weights from our sim runs" gamedata/simweights.json

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy here. The
      # talent pages' build lists (ours, wowsims', the community's) come from talent-builds.yml.
      - name: Deploy the site with the new data
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
