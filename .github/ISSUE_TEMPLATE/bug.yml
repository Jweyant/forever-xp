name: Bug or wrong data
description: Something on forever-xp.com or in a guide is broken or wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The page link, or the guide and step number.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: What you saw, and what it should be if you know.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Game build (optional)
      description: Shown on the login screen, e.g. 1.60.1.70888
