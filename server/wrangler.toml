name = "foreverscout"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "foreverscout-logs"

# Burst limit on writes (withinBurst in src/index.js).
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 5, period = 10 }

# Starts the Blizzard notes workflow every 15 minutes (startNotesRun in src/index.js).
[triggers]
crons = ["*/15 * * * *"]

# Set the admin token (used by tools/pull_logs.py) with:
#   npx wrangler secret put ADMIN_TOKEN
# and the GitHub token that starts the notes workflow with:
#   npx wrangler secret put GH_DISPATCH_TOKEN
